name: super_market
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3

  # ✅ ObjectBox (UPGRADED FOR DART 3.9+)
  objectbox: ^4.1.0
  objectbox_flutter_libs: ^4.1.0

  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5


  mongo_dart: ^0.10.5

  device_info_plus: ^12.3.0
  barcode_widget: ^2.0.4
  pdf: ^3.11.3
  printing: ^5.14.2
  url_launcher: ^6.3.2
  fl_chart: ^0.70.2

  # ✅ IMPORTANT (compatible with mongo_dart)
  http: ^1.6.0
  http_parser: ^4.0.2
  dio: ^5.7.0

  share_plus: ^12.0.1
  dropdown_search: ^5.0.6
  flutter_typeahead: ^5.2.0

  # ✅ Excel (compatible version)
  excel: ^3.0.0

  file_picker: ^8.3.7
  objectid: ^4.0.3
  google_fonts: ^4.0.4
  archive: ^3.6.1
  record: ^6.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ✅ ObjectBox generator (MATCH VERSION)
  build_runner: ^2.3.3
  objectbox_generator: ^4.1.0
flutter:
  uses-material-design: true

  assets:
    - assets/json/
    - assets/fonts/
    - assets/translations/

  fonts:
    - family: SegoeUI
      fonts:
        - asset: assets/fonts/segoeui.ttf
        - asset: assets/fonts/segoeuib.ttf
          weight: 700
