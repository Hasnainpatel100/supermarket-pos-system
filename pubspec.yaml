name: super_market
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1
environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  # object box++
  objectbox: ^5.1.0
  objectbox_flutter_libs: ^5.1.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  # object box--
  mongo_dart: ^0.10.5
  device_info_plus: ^12.3.0 #device info
  barcode_widget: ^2.0.4    # 1D barcode + 2D QR rendering
  pdf: ^3.11.1              # PDF document generation
  printing: ^5.13.4         # PDF preview & share
  url_launcher: ^6.3.1      # Launch WhatsApp deep link
  fl_chart: ^0.70.2         # Dashboard charts
  http: ^1.6.0
  share_plus: ^12.0.1
  dropdown_search: ^5.0.6
  flutter_typeahead: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # object box++
  build_runner: ^2.10.4
  objectbox_generator: ^5.1.0
  # object box--

flutter:
  uses-material-design: true
  assets:
    - assets/json/
    - assets/fonts/
